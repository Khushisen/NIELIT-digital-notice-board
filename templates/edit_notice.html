<!DOCTYPE html>
<html>
<head>
    <title>Edit Notice - Notice Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white rounded-lg shadow-xl p-8">
        <h2 class="text-3xl font-bold mb-6 text-gray-800">Edit Notice</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-4">
                <label for="title" class="block text-gray-700 text-sm font-bold mb-2">Title</label>
                <input type="text" id="title" name="title" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ notice.title }}" required>
            </div>
            <div class="mb-4">
                <label for="content" class="block text-gray-700 text-sm font-bold mb-2">Content</label>
                <textarea id="content" name="content" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 h-32 resize-y" required>{{ notice.content }}</textarea>
            </div>
            <div class="mb-4">
                <label for="category" class="block text-gray-700 text-sm font-bold mb-2">Category</label>
                <select id="category" name="category" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="announcements" {% if notice.category == 'announcements' %}selected{% endif %}>Announcements</option>
                    <option value="events" {% if notice.category == 'events' %}selected{% endif %}>Events</option>
                    <option value="exams" {% if notice.category == 'exams' %}selected{% endif %}>Exams</option>
                    <option value="other" {% if notice.category == 'other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="mb-6">
                <label for="files" class="block text-gray-700 text-sm font-bold mb-2">Upload New Files (optional)</label>
                <input type="file" id="files" name="files" multiple class="block w-full text-gray-700 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
            {% if notice.files %}
                <p class="text-gray-700 font-semibold mb-2">Existing Files:</p>
                <ul class="list-disc list-inside mb-6 text-gray-600">
                    {% for file in notice.files.split(',') %}
                        <li><a href="{{ url_for('uploaded_file', filename=file.strip()) }}" target="_blank" class="text-blue-600 hover:underline">{{ file }}</a></li>
                    {% endfor %}
                </ul>
            {% endif %}
            <div class="flex justify-end space-x-4">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center">
                    <i class="fas fa-save mr-2"></i>Update
                </button>
                <a href="{{ url_for('admin_dashboard') }}" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition duration-300 flex items-center">
                    <i class="fas fa-times mr-2"></i>Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

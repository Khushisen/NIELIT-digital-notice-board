<!DOCTYPE html>
<html>
<head>
    <title>Edit Notice - Digital Notice Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2>Edit Notice</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label>Title</label>
            <input type="text" name="title" class="form-control" value="{{ notice.title }}" required>
        </div>
        <div class="mb-3">
            <label>Content</label>
            <textarea name="content" class="form-control" rows="5" required>{{ notice.content }}</textarea>
        </div>
        <div class="mb-3">
            <label>Upload New Files (optional)</label>
            <input type="file" name="files" multiple class="form-control">
        </div>
        {% if notice.files %}
            <p>Existing Files:</p>
            <ul>
                {% for file in notice.files.split(',') %}
                    <li><a href="{{ url_for('uploaded_file', filename=file.strip()) }}" target="_blank">{{ file }}</a></li>
                {% endfor %}
            </ul>
        {% endif %}
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>

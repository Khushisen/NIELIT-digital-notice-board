<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIELIT Notice Board</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <style>
    /* Glassmorphism effect */
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }

    /* 3D Hover Animation */
    .notice-card {
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      transform-style: preserve-3d;
      position: relative; /* Needed for the ::before pseudo-element */
      overflow: hidden; /* Hide the glowing border when outside the card */
    }

    .notice-card:hover {
      transform: scale(1.05) rotateX(10deg) rotateY(10deg);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 25px rgba(59,130,246,0.8);
    }

    /* Gradient Glow Buttons */
    .glow-btn {
      background: linear-gradient(45deg, #3b82f6, #9333ea, #ec4899);
      background-size: 200% 200%;
      animation: gradientShift 4s infinite;
      color: white;
      font-weight: bold;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glow-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(236,72,153,0.8), 0 0 40px rgba(147,51,234,0.7);
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Themed Card Style: A glowing border effect */
    .notice-card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        background: linear-gradient(45deg, #3b82f6, #9333ea, #ec4899, #3b82f6);
        background-size: 400% 400%;
        z-index: -1;
        border-radius: 12px;
        opacity: 0.8;
        animation: gradientShift 4s infinite;
        transition: opacity 0.4s ease;
    }
    
    .notice-card:hover::before {
        opacity: 1;
    }
    
    .notice-card .card-content {
      position: relative;
      z-index: 1;
    }
    /* Make cards uniform inside carousel */
    .swiper-slide {
      width: 320px;
      height: auto;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-gray-100">

  <div class="hero-bg py-12">
    <div class="relative z-10 flex flex-col items-center justify-center h-full text-white px-4">
      <img src="/static/images/nielit-logo.png" 
           alt="NIELIT Logo" 
           class="mb-6 w-32 md:w-40 rounded-lg shadow-lg bg-white p-2" />
      <h1 class="text-4xl md:text-6xl font-bold mb-4 text-center">
        National Institute of Electronics And Information Technology, Ajmer
      </h1>
      <p class="text-xl md:text-2xl text-center mb-6">
        Under the Ministry of Electronics And Information Technology
      </p>
    </div>
  </div>

  <nav class="glass-card text-white py-4 shadow-2xl sticky top-0 z-50 border-b border-gray-800">
    <div class="container mx-auto px-6 flex items-center justify-between">
      <div class="flex space-x-3">
        <button onclick="showCategory('all')" class="glow-btn px-5 py-2 rounded-lg">All Notices</button>
        <button onclick="showCategory('announcements')" class="glow-btn px-5 py-2 rounded-lg">Announcements</button>
        <button onclick="showCategory('events')" class="glow-btn px-5 py-2 rounded-lg">Events</button>
        <button onclick="showCategory('exams')" class="glow-btn px-5 py-2 rounded-lg">Exams</button>
        <button onclick="showCategory('resources')" class="glow-btn px-5 py-2 rounded-lg">Resources</button>
      </div>

      <div class="flex ml-auto">
        <input type="text" id="search" 
          class="w-72 px-4 py-2 text-gray-800 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-pink-500 transition duration-300" 
          placeholder="Search notices...">
        <button onclick="searchNotices()" class="glow-btn px-5 py-2 rounded-r-lg">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container mx-auto px-4 py-10">
    <div class="swiper mySwiper">
      <div class="swiper-wrapper" id="notices-slides">
        </div>
      <div class="swiper-pagination"></div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>
  </div>

  <div class="text-center mt-8">
    <button onclick="openAddNoticeModal()" class="glow-btn px-6 py-3 rounded-lg">
      <i class="fas fa-plus mr-2"></i>Add New Notice
    </button>
  </div>

  <div id="addNoticeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
    <div class="flex items-center justify-center min-h-screen px-4">
      <div class="glass-card rounded-lg shadow-2xl w-full max-w-md p-6">
        <h2 class="text-2xl font-bold mb-4">Add New Notice</h2>
        <form id="addNoticeForm" method="POST" action="{{ url_for('add_notice') }}">
          <input type="text" name="title" class="w-full mb-4 px-3 py-2 border rounded" placeholder="Notice Title" required>
          <select name="category" class="w-full mb-4 px-3 py-2 border rounded">
            <option value="announcements">Announcements</option>
            <option value="events">Events</option>
            <option value="exams">Exams</option>
            <option value="resources">Resources</option>
          </select>
          <textarea name="content" class="w-full mb-4 px-3 py-2 border rounded" rows="4" placeholder="Notice Description" required></textarea>
          <div class="flex justify-between">
            <button type="button" onclick="closeAddNoticeModal()" class="bg-gray-500 hover:bg-gray-600 px-4 py-2 rounded text-white">Cancel</button>
            <button type="submit" class="glow-btn px-4 py-2 rounded">Add Notice</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-gray-900 text-white py-6 mt-8">
    <div class="container mx-auto px-4 text-center">
      <p>© 2025 NIELIT Notice Board. All rights reserved.</p>
      <div class="mt-4 space-x-4">
        <a href="#" class="hover:text-blue-400"><i class="fab fa-facebook text-xl"></i></a>
        <a href="#" class="hover:text-blue-400"><i class="fab fa-twitter text-xl"></i></a>
        <a href="#" class="hover:text-blue-400"><i class="fab fa-instagram text-xl"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    let notices = {{ notices_json | tojson | safe }};

    function renderSlides(notices) {
      const slidesContainer = document.getElementById('notices-slides');
      slidesContainer.innerHTML = '';

      if (!notices || notices.length === 0) {
        slidesContainer.innerHTML = '<p class="text-center text-gray-400">No notices found.</p>';
        return;
      }

      notices.forEach(notice => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';

        slide.innerHTML = `
          <div class="notice-card glass-card rounded-xl overflow-hidden p-4">
            <div class="card-content">
              <img src="${notice.image}" alt="${notice.title}" class="w-full h-40 object-cover rounded-lg" />
              <div class="p-4">
                <div class="flex justify-between items-start mb-2">
                  <h3 class="text-xl font-bold text-gray-100">${notice.title}</h3>
                  <span class="bg-blue-500 text-white px-2 py-1 rounded text-xs">${notice.category.toUpperCase()}</span>
                </div>
                <p class="text-gray-300 mb-4">${notice.content}</p>
                <div class="flex justify-between items-center">
                  <span class="text-gray-400 text-sm">${new Date(notice.date).toLocaleString()}</span>
                  <a href="/notice/${notice.id}" class="glow-btn px-4 py-2 rounded">View</a>
                </div>
              </div>
            </div>
          </div>
        `;
        slidesContainer.appendChild(slide);
      });
    }

    renderSlides(notices);

    function showCategory(category) {
      if (category === 'all') {
        renderSlides(notices);
      } else {
        const filtered = notices.filter(n => n.category === category);
        renderSlides(filtered);
      }
      swiper.update();
    }

    function searchNotices() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = notices.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));
      renderSlides(filtered);
      swiper.update();
    }

    function openAddNoticeModal() {
      document.getElementById('addNoticeModal').classList.remove('hidden');
    }

    function closeAddNoticeModal() {
      document.getElementById('addNoticeModal').classList.add('hidden');
    }

    // Swiper 3D Carousel
    const swiper = new Swiper(".mySwiper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      coverflowEffect: {
        rotate: 40,
        stretch: 0,
        depth: 150,
        modifier: 1.2,
        slideShadows: true,
      },
      loop: true,
      autoplay: {
        delay: 2500,
        disableOnInteraction: false,
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIELIT Notice Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .notice-card {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-bg {
            background: url('/static/images/background.jpg') no-repeat center center;
            background-size: cover;
            height: 300px;
            position: relative;
        }
        .hero-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
        }
        .notice-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .search-input {
            border-right: none;
        }
    </style>
</head>
<body class="text-gray-800">
    <!-- Hero Section -->
    <div class="hero-bg">
        <div class="relative z-10 flex flex-col items-center justify-center h-full text-white px-4">
          <img src="/static/images/nielit-logo.png" 
           alt="NIELIT Logo" 
           class="mb-6 w-32 md:w-40 rounded-lg shadow-lg bg-white p-2" />
            <h1 class="text-4xl md:text-6xl font-bold mb-4 text-center">National Institute of Electronics And Information Technology, Ajmer</h1>
            <p class="text-xl md:text-2xl text-center mb-6">Under the Ministry of Electronics And Information Technology</p>
            <!-- <img src="https://storage.googleapis.com/workspace-0f70711f-8b4e-4d94-86f1-2a93ccde5887/image/6c0fe5fc-dd02-457d-a101-c18c789a8e0c.png" alt="Official university logo featuring a stylized book and graduation cap with the motto 'Excellence Through Innovation' in elegant serif font" class="mb-4 rounded-lg shadow-lg" /> -->
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bg-gray-800 text-white py-4 shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex flex-wrap items-center justify-between">
                <div class="flex space-x-4">
                    <button onclick="showCategory('all')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded transition duration-300">All Notices</button>
                    <button onclick="showCategory('announcements')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition duration-300">Announcements</button>
                    <button onclick="showCategory('events')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition duration-300">Events</button>
                    <button onclick="showCategory('exams')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition duration-300">Exams</button>
                    <button onclick="showCategory('resources')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition duration-300">Resources</button>
                </div>
                <div class="flex mt-4 md:mt-0">
                    <input type="text" id="search" class="w-64 px-4 py-2 text-gray-700 rounded-l focus:outline-none focus:ring-2 focus:ring-blue-500 search-input" placeholder="Search notices...">
                    <button onclick="searchNotices()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-r">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="notices-container">
            <!-- Notices will be populated here by JavaScript -->
        </div>

        <!-- Add Notice Button (For Admins) -->
        <div class="text-center mt-8">
            <!-- This button will open the modal. The form inside the modal will submit to the Flask backend. -->
            <!-- Note: Adding a notice requires admin login as per app.py. If not logged in, it will redirect to login. -->
            <button onclick="openAddNoticeModal()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg transition duration-300 shadow-lg">
                <i class="fas fa-plus mr-2"></i>Add New Notice
            </button>
        </div>
    </div>

    <!-- Modal for Adding Notices -->
    <div id="addNoticeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-6">
                <h2 class="text-2xl font-bold mb-4">Add New Notice</h2>
                <!-- Form action points to Flask's add_notice route -->
                <form id="addNoticeForm" method="POST" action="{{ url_for('add_notice') }}">
                    <input type="text" name="title" class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Notice Title" required>
                    <!-- Name attribute changed to 'category' to match Flask backend -->
                    <select name="category" class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="announcements">Announcements</option>
                        <option value="events">Events</option>
                        <option value="exams">Exams</option>
                        <option value="resources">Resources</option>
                    </select>
                    <!-- Name attribute changed to 'content' to match Flask backend -->
                    <textarea name="content" class="w-full mb-4 px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Notice Description" required></textarea>
                    <div class="flex justify-between">
                        <button type="button" onclick="closeAddNoticeModal()" class="bg-gray-500 hover:bg-gray-600 px-4 py-2 rounded text-white">Cancel</button>
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Add Notice</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-8">
        <div class="container mx-auto px-4 text-center">
            <p>© 2025 NIELIT Notice Board. All rights reserved.</p>
            <div class="mt-4 space-x-4">
                <a href="https://www.facebook.com/profile.php?id=100018440221971" class="hover:text-blue-400"><i class="fab fa-facebook text-xl"></i></a>
                <a href="https://x.com/AJM_NIELIT" class="hover:text-blue-400"><i class="fab fa-twitter text-xl"></i></a>
                <a href="https://www.instagram.com/nielit_ajm?igsh=bGxmbHFtZHl2ZHNp" class="hover:text-blue-400"><i class="fab fa-instagram text-xl"></i></a>
            </div>
        </div>
    </footer>
<script>
  let notices = {{ notices_json | tojson | safe }};

  function renderNotices(notices) {
    const container = document.getElementById('notices-container');
    container.innerHTML = '';

    if (!notices || notices.length === 0) {
      container.innerHTML = '<p class="col-span-full text-center text-gray-600">No notices found.</p>';
      return;
    }

    notices.forEach(notice => {
      const card = document.createElement('div');
      card.className = 'notice-card bg-white rounded-lg shadow-md overflow-hidden';

      card.innerHTML = `
        <img src="${notice.image}" alt="${notice.title}" class="notice-image" />
        <div class="p-6">
          <div class="flex justify-between items-start mb-2">
            <h3 class="text-xl font-bold text-gray-800">${notice.title}</h3>
            <span class="bg-blue-500 text-white px-2 py-1 rounded text-xs">${notice.category.toUpperCase()}</span>
          </div>
          <p class="text-gray-600 mb-4">${notice.content}</p>
          <div class="flex justify-between items-center">
            <span class="text-gray-500 text-sm">${new Date(notice.date).toLocaleString()}</span>
            <a href="/notice/${notice.id}" 
   class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded transition duration-300">
   View Details
</a>

          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  renderNotices(notices);

  function showCategory(category) {
    if (category === 'all') {
      renderNotices(notices);
    } else {
      const filtered = notices.filter(n => n.category === category);
      renderNotices(filtered);
    }
  }

  function searchNotices() {
    const query = document.getElementById('search').value.toLowerCase();
    const filtered = notices.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));
    renderNotices(filtered);
  }

  function openAddNoticeModal() {
    document.getElementById('addNoticeModal').classList.remove('hidden');
  }

  function closeAddNoticeModal() {
    document.getElementById('addNoticeModal').classList.add('hidden');
  }

</script>


</body>
</html>
